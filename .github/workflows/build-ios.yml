name: Build iOS experimental

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ThreeOneOSFive.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA artifact
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ThreeOneOSFive.xcarchive/Products/Applications/ThreeOneOSFive.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "ThreeOneOSFive-ios27-24A446-unsigned.ipa" Payload)
          shasum -a 256 "$RUNNER_TEMP/ThreeOneOSFive-ios27-24A446-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-ios27-24A446-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-ios27-24A446-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
