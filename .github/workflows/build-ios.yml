name: Build iOS experimental

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -x
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project ThreeOneOSFive.xcodeproj -target 3105 -showBuildSettings

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ThreeOneOSFive.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA artifact
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/ThreeOneOSFive.xcarchive/Products/Applications"
          APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          echo "Packaging app: $APP"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "ThreeOneOSFive-ios27-24A446-unsigned.ipa" Payload)
          shasum -a 256 "$RUNNER_TEMP/ThreeOneOSFive-ios27-24A446-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-ios27-24A446-unsigned
          path: ${{ runner.temp }}/ThreeOneOSFive-ios27-24A446-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish persistent download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/ThreeOneOSFive-ios27-24A446-unsigned.ipa"
          TAG="experimental-latest"
          TITLE="3105 experimental iOS 27.0.1 (24A446) — latest"
          SHA256="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          NOTES="Experimental unsigned IPA for iOS 27.0.1 build 24A446.

          Commit: $GITHUB_SHA
          SHA-256: $SHA256

          This IPA is unsigned and requires signing before installation. Compatibility with device-level exploit functionality is not guaranteed."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          fi

          gh release upload "$TAG" "$IPA" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Persistent download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$IPA")"
          echo "SHA-256: $SHA256"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
